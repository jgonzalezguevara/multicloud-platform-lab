apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-platform-dashboard
  namespace: observability
data:
  platform-overview.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": false,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "expr": "up",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ],
          "title": "Prometheus Targets",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "expr": "count(up == 1)",
              "refId": "A"
            }
          ],
          "title": "Healthy Targets",
          "type": "stat"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 41,
      "tags": [
        "multicloud",
        "platform-engineering"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "title": "Multicloud Platform Overview",
      "uid": "multicloud-platform-overview",
      "version": 1
    }
