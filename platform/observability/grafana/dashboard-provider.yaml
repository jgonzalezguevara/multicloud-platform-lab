apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Multicloud Platform Lab
        orgId: 1
        folder: Platform
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
