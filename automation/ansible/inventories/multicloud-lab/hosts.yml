---
all:
  children:
    rke2_cluster:
      children:
        rke2_servers:
          hosts:
            rke2-cp01:
              ansible_host: 10.20.0.11
              rke2_first_server: true
            rke2-cp02:
              ansible_host: 10.20.0.12
            rke2-cp03:
              ansible_host: 10.20.0.13

        rke2_agents:
          hosts:
            rke2-worker01:
              ansible_host: 10.20.0.21

    harbor:
      hosts:
        harbor-registry:
          ansible_host: 10.20.0.30

  vars:
    ansible_user: automation
    ansible_port: 22
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519_multicloud
    ansible_python_interpreter: /usr/bin/python3
